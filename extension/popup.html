<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafeSphere Guard</title>
<style>
  body { margin: 0; width: 320px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2233; background: #fff; }
  header { padding: 12px 14px; background: #4338ca; color: #fff; }
  header strong { font-size: 16px; }
  #conn { display: block; font-size: 12px; opacity: .9; margin-top: 2px; }
  section { padding: 10px 14px; border-bottom: 1px solid #e3e6f0; }
  h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7288; }
  label { display: flex; align-items: center; gap: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 5px 8px; border: 1px solid #c7cbe0; border-radius: 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 0; border-bottom: 1px solid #f0f1f6; }
  li:last-child { border: 0; }
  .lv { font-size: 10px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 6px; margin-right: 6px; }
  .high { background: #e2622b; } .critical { background: #d6264f; }
  .muted { color: #6b7288; font-size: 12px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button, a.btn { font: inherit; font-size: 12px; border-radius: 6px; border: 1px solid #c7cbe0; background: #fff; color: #1d2233; padding: 5px 10px; cursor: pointer; text-decoration: none; }
  button.danger { color: #b4233f; border-color: #f2a7b6; }
</style>
</head>
<body>
<header><strong>SafeSphere Guard</strong><span id="conn">Checking backend…</span></header>
<section>
  <label><input type="checkbox" id="enabled"> Monitor chatrooms on this browser</label>
  <p class="muted">Takes effect when the chat page is reloaded. Only messages aimed at you are checked, and only by your local SafeSphere backend.</p>
</section>
<section>
  <h2>Recent alerts</h2>
  <ul id="alerts"><li class="muted">None yet</li></ul>
</section>
<section>
  <h2>Backend address</h2>
  <input type="text" id="api" spellcheck="false">
  <div class="row">
    <button id="save">Save</button>
    <a class="btn" id="dash" target="_blank" rel="noopener">Open dashboard</a>
    <button id="clear" class="danger">Clear SafeSphere data</button>
  </div>
</section>
<script src="popup.js"></script>
</body>
</html>
