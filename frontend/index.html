<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
/* Calm, trustworthy palette. Brand = indigo, kept apart from the severity colours (green/amber/orange/red)
   so "brand" never reads as "warning". */
.ss{--bg:#F6F7FB;--surface:#ffffff;--surface2:#F1F3F8;--ink:#141A2A;--muted:#5D6678;--line:#E4E7EF;
  --brand:#4F46E5;--brandHover:#4338CA;--brandInk:#3730A3;--brandSoft:#EEF0FF;
  --crit:#DC2650;--critHover:#BE1E44;--info-bg:#E7F6EF;--info-ink:#17694A;--warn-bg:#FDF4DC;--warn-ink:#7A5200;
  --high-bg:#FDEBE3;--high-ink:#A63C12;--crit-bg:#FDE7EC;--crit-ink:#A8133A;
  --shadow:0 1px 2px rgba(20,26,42,.04),0 4px 16px rgba(20,26,42,.05);--radius:16px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif!important}
.ss.dark{--bg:#0E1220;--surface:#161B2B;--surface2:#1F2538;--ink:#EEF1F8;--muted:#9AA3B8;--line:#2A3146;
  --brand:#7C74FF;--brandHover:#8F88FF;--brandInk:#C9C5FF;--brandSoft:#24224A;
  --crit:#E8406A;--critHover:#F05A80;--info-bg:#123527;--info-ink:#7FDCB0;--warn-bg:#382B0C;--warn-ink:#F2C95C;
  --high-bg:#3C2013;--high-ink:#FFAB84;--crit-bg:#42121F;--crit-ink:#FF92AC;--shadow:0 1px 2px rgba(0,0,0,.4)}
.ss *{box-sizing:border-box}
.ss a{color:var(--brand)}.ss a:hover{color:var(--brandHover)}
.ss :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ss h2{letter-spacing:-.01em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brandHover);border-color:var(--brandHover)}
.btn-danger{background:var(--crit);border-color:var(--crit);color:#fff}.btn-danger:hover{background:var(--critHover)}
.ss a.btn-primary,.ss a.btn-danger{color:#fff}
/* help is important but should not shout from every screen */
.btn-help{background:var(--crit-bg);border-color:transparent;color:var(--crit-ink)}.btn-help:hover{background:var(--crit);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--ink)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:0}
.chip .dot{width:7px;height:7px;border-radius:50%}
.sev-info{background:var(--info-bg);color:var(--info-ink)}.sev-info .dot{background:#2f9e6e}
.sev-warn{background:var(--warn-bg);color:var(--warn-ink)}.sev-warn .dot{background:#c98a00}
.sev-high{background:var(--high-bg);color:var(--high-ink)}.sev-high .dot{background:#e2622b}
.sev-critical{background:var(--crit-bg);color:var(--crit-ink)}.sev-critical .dot{background:#d6264f}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:600;white-space:nowrap}
.badge{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.b-WA{background:#128c4a}.b-IG{background:linear-gradient(135deg,#e1306c,#c13584 50%,#833ab4)}.b-TG{background:#1769b8}.b-SMS{background:#5f6470}.b-SNAP{background:#fffc00;color:#111}.b-YOU{background:var(--brand)}
/* severity accent: a thin left edge instead of a heavy border */
.bl-info{box-shadow:inset 3px 0 0 #2f9e6e,var(--shadow)}.bl-warn{box-shadow:inset 3px 0 0 #c98a00,var(--shadow)}.bl-high{box-shadow:inset 3px 0 0 #e2622b,var(--shadow)}.bl-critical{box-shadow:inset 3px 0 0 #d6264f,var(--shadow)}.bl-none{box-shadow:var(--shadow)}
.riskbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill-info{background:#2f9e6e}.fill-warn{background:#c98a00}.fill-high{background:#e2622b}.fill-critical{background:#d6264f}

/* navigation */
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.active{background:var(--brandSoft);color:var(--brandInk)}
.nav-btn svg{flex:none;opacity:.9}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.75;padding:14px 12px 6px}
.nav-label:first-child{padding-top:2px}
.nb{min-width:20px;height:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.nb-red{background:var(--crit);color:#fff}.nb-grey{background:var(--surface2);color:var(--muted)}

/* page header: title + one plain sentence on what this screen is for */
.page-head{display:flex;flex-direction:column;gap:4px;min-width:0}
.page-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:68ch}

/* one compact strip instead of four boxes */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat-v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat-l{font-size:12px;color:var(--muted);font-weight:600}

/* demo controls live in their own clearly-labelled bar */
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line)}
.demo-tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brandInk);background:var(--brandSoft);padding:4px 8px;border-radius:6px}

.meta{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.field{width:100%;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.field:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brandSoft)}
textarea.field{min-height:96px;resize:vertical;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.drop:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.spin{animation:ssspin 1s linear infinite}
.pop{animation:sspop .25s ease-out}
@keyframes ssspin{to{transform:rotate(360deg)}}
@keyframes sspop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}.switch.on::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:36px;padding:0 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--brandSoft);color:var(--brandInk)}

.layout{display:flex;flex-wrap:wrap;align-items:flex-start}
.side{flex:1 1 220px;max-width:240px;position:sticky;top:72px}
.mainc{flex:999 1 560px;min-width:0}
.navlist{display:flex;flex-direction:column;gap:2px}
.side{min-width:0}
@media (max-width:820px){.side{max-width:none;flex-basis:100%;width:100%;position:static}.navlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav-btn{white-space:nowrap;width:auto}.nav-label{display:none}.hide-sm{display:none!important}.stat{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.ss *{animation:none!important;transition:none!important}}
</style>
</head>

<script type="text/plain" id="tpl">


<div class="ss {{ themeClass }}" style="min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', sans-serif; font-size: 14px; line-height: 1.45">


<sc-if value="{{ exitMode }}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; background: #eef4fb; color: #18324d; padding: 32px 16px; font-family: system-ui, sans-serif">
<div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 22px">Weather</h1>
<button class="btn btn-ghost btn-sm" style="color: #18324d" onClick="{{ leaveExit }}" aria-label="Done">Done</button>
</div>
<div style="background: #ffffff; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #4a6380">Today · Partly cloudy</div>
<div style="font-size: 64px; font-weight: 700; line-height: 1">29°</div>
<div style="font-size: 14px; color: #4a6380">High 31° · Low 24° · Humidity 72%</div>
</div>
<div style="background: #ffffff; border-radius: 16px; padding: 8px 24px">
<sc-for list="{{ forecast }}" as="f" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e3ebf4"><span>{{ f.d }}</span><span style="color: #4a6380">{{ f.s }}</span><span style="font-weight: 600">{{ f.t }}</span></div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ appMode }}" hint-placeholder-val="{{ true }}">

<header style="position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px; margin-right: 8px">
<div style="width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
<span style="font-size: 17px; font-weight: 800; letter-spacing: -.01em">SafeSphere</span>
</div>
<button class="btn btn-sm" onClick="{{ protection.toggle }}" aria-label="{{ protection.aria }}" style="border-radius: 999px; background: var(--surface2); border-color: transparent">
<span style="{{ protection.dot }}"></span><span>{{ protection.label }}</span>
</button>
<button class="chip hide-sm" style="{{ conn.style }}" title="{{ conn.title }}" onClick="{{ conn.click }}">{{ conn.label }}</button>
<div style="flex: 1"></div>
<div style="position: relative">
<button class="btn btn-ghost btn-sm" onClick="{{ toggleBell }}" aria-label="Latest alerts" aria-expanded="{{ bell.open }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
<sc-if value="{{ bell.hasCount }}" hint-placeholder-val="{{ false }}"><span class="nb nb-red">{{ bell.count }}</span></sc-if>
</button>
<sc-if value="{{ bell.open }}" hint-placeholder-val="{{ false }}">
<div class="card pop" style="position: absolute; right: 0; top: 46px; width: 320px; max-width: 86vw; padding: 8px; z-index: 30">
<div style="padding: 8px 10px; font-weight: 700">Latest alerts</div>
<sc-if value="{{ bell.empty }}" hint-placeholder-val="{{ false }}"><div class="meta" style="padding: 8px 10px 12px">No alerts yet.</div></sc-if>
<sc-for list="{{ bell.items }}" as="b" hint-placeholder-count="3">
<button class="nav-btn" style="min-height: 52px; align-items: flex-start; padding: 8px 10px; flex-direction: column; gap: 2px" onClick="{{ b.open }}">
<span style="display: flex; gap: 8px; align-items: center"><span class="chip {{ b.sevClass }}"><span class="dot"></span>{{ b.sevLabel }}</span><span style="font-weight: 700">{{ b.from }}</span></span>
<span class="meta" style="font-weight: 400">{{ b.cat }} · {{ b.time }}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
<button class="btn btn-sm" onClick="{{ quickExit }}" aria-label="Quick exit to a neutral screen" title="Instantly switch to a harmless weather screen">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"></path></svg>{{ t.exit }}
</button>
</header>

<div class="layout" style="max-width: 1400px; margin: 0 auto; padding: 24px 20px; gap: 28px">

<nav class="side" aria-label="Main">
<div class="navlist">
<div class="nav-label">Stay safe</div>
<button class="nav-btn {{ nav.home.cls }}" onClick="{{ nav.home.go }}" aria-current="{{ nav.home.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span style="flex: 1">{{ t.home }}</span></button>
<button class="nav-btn {{ nav.feed.cls }}" onClick="{{ nav.feed.go }}" aria-current="{{ nav.feed.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"></path></svg><span style="flex: 1">{{ t.feed }}</span><sc-if value="{{ nav.feed.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="nb nb-red" aria-label="unread alerts">{{ nav.feed.badge }}</span></sc-if></button>
<button class="nav-btn {{ nav.people.cls }}" onClick="{{ nav.people.go }}" aria-current="{{ nav.people.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"></path></svg><span style="flex: 1">{{ t.people }}</span><sc-if value="{{ nav.people.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="nb nb-grey">{{ nav.people.badge }}</span></sc-if></button>
<div class="nav-label">Take action</div>
<button class="nav-btn {{ nav.media.cls }}" onClick="{{ nav.media.go }}" aria-current="{{ nav.media.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg><span style="flex: 1">{{ t.media }}</span></button>
<button class="nav-btn {{ nav.import.cls }}" onClick="{{ nav.import.go }}" aria-current="{{ nav.import.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg><span style="flex: 1">{{ t.import }}</span></button>
<button class="nav-btn {{ nav.evidence.cls }}" onClick="{{ nav.evidence.go }}" aria-current="{{ nav.evidence.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M9 15l2 2 4-4"></path></svg><span style="flex: 1">{{ t.evidence }}</span><sc-if value="{{ nav.evidence.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="nb nb-grey">{{ nav.evidence.badge }}</span></sc-if></button>
<div class="nav-label">More</div>
<button class="nav-btn {{ nav.metrics.cls }}" onClick="{{ nav.metrics.go }}" aria-current="{{ nav.metrics.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span style="flex: 1">{{ t.metrics }}</span></button>
<button class="nav-btn {{ nav.slang.cls }}" onClick="{{ nav.slang.go }}" aria-current="{{ nav.slang.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"></path></svg><span style="flex: 1">{{ t.slang }}</span><sc-if value="{{ nav.slang.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="nb nb-grey">{{ nav.slang.badge }}</span></sc-if></button>
<button class="nav-btn {{ nav.settings.cls }}" onClick="{{ nav.settings.go }}" aria-current="{{ nav.settings.current }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg><span style="flex: 1">{{ t.settings }}</span></button>
</div>
<button class="btn btn-help" style="width: 100%; margin-top: 16px; min-height: 48px" onClick="{{ openHelp }}" aria-label="Get help now">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>{{ t.help }}
</button>
<p class="meta hide-sm" style="margin: 12px 6px 0; display: flex; gap: 8px; align-items: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Private by design: clean messages never leave this device.</span></p>
</nav>

<main class="mainc">


<sc-if value="{{ is.home }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="page-head" style=""><h1 class="page-title">{{ t.home }}</h1><p class="page-sub">{{ sub.home }}</p></div>
<div class="card {{ home.statusBorder }}" style="padding: 20px 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
<div style="flex: 1; min-width: 240px">
<div style="font-size: 20px; font-weight: 800">{{ home.headline }}</div>
<div class="muted" style="margin-top: 4px">{{ home.sub }}</div>
</div>
<span class="chip {{ home.worstClass }}"><span class="dot"></span>Worst level: {{ home.worstLabel }}</span>
</div>
<div class="stats"><sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4"><div class="stat"><div class="stat-v">{{ k.value }}</div><div class="stat-l">{{ k.label }}</div></div></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section class="card" style="flex: 1 1 360px; padding: 18px; min-width: 0">
<h2 style="margin: 0 0 12px; font-size: 16px">Needs attention</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ home.attention }}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px">
<div style="width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-weight: 800">{{ p.initials }}</div>
<div style="flex: 1; min-width: 0"><div style="font-weight: 700">{{ p.name }}</div><div class="meta">{{ p.tagline }}</div></div>
<span class="chip {{ p.sevClass }}"><span class="dot"></span>{{ p.sevLabel }}</span>
<button class="btn btn-sm" onClick="{{ p.view }}">View</button>
</div>
</sc-for>
</div>
</section>
<section class="card" style="flex: 1 1 360px; padding: 18px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px"><h2 style="margin: 0; font-size: 16px">Recent alerts</h2><button class="btn btn-sm btn-ghost" onClick="{{ nav.feed.go }}">See all</button></div>
<sc-if value="{{ home.noAlerts }}" hint-placeholder-val="{{ false }}">
<div style="text-align: center; padding: 24px 8px">
<div class="muted" style="margin-bottom: 12px">No alerts yet. The demo feed is paused.</div>
<button class="btn btn-primary" onClick="{{ startFromHome }}">Start the demo feed</button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ home.recent }}" as="a" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line)">
<span class="badge b-{{ a.app }}">{{ a.app }}</span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 700">{{ a.from }}</div><div class="meta">{{ a.cat }} · {{ a.time }}</div></div>
<span class="chip {{ a.sevClass }}"><span class="dot"></span>{{ a.sevLabel }}</span>
</div>
</sc-for>
</div>
</section>
</div>
<section class="card" style="padding: 18px">
<h2 style="margin: 0 0 12px; font-size: 16px">Quick actions</h2>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button class="btn" onClick="{{ nav.media.go }}">Check a photo or video</button>
<button class="btn" onClick="{{ nav.import.go }}">Import a chat</button>
<button class="btn btn-help" onClick="{{ openHelp }}">Get help now</button>
</div>
</section>
</div>
</sc-if>


<sc-if value="{{ is.feed }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<div class="page-head" style="flex: 1; "><h1 class="page-title">{{ t.feed }}</h1><p class="page-sub">{{ sub.feed }}</p></div>
</div>
<div class="demo-bar">
<span class="demo-tag">Demo</span>
<label class="sr-only" for="scen">Choose a demo chat</label>
<select id="scen" class="field" style="width: auto; flex: 1 1 260px; min-height: 38px" value="{{ feed.scenario }}" onChange="{{ feed.setScenario }}">
<option value="refusal">You said no (please stop · mat karo · bhaiya)</option>
<option value="full">Full demo</option>
<option value="stalker">Silent stalker</option>
<option value="sextortion">Sextortion</option>
<option value="bullying">Class bullying</option>
<option value="flirt">Mutual flirting (should stay safe)</option>
</select>
<div class="seg" role="group" aria-label="Playback speed">
<button class="{{ feed.sp1 }}" onClick="{{ feed.speed1 }}" aria-pressed="{{ feed.sp1on }}">1×</button>
<button class="{{ feed.sp2 }}" onClick="{{ feed.speed2 }}" aria-pressed="{{ feed.sp2on }}">2×</button>
</div>

<div style="font-size: 16px; font-weight: 600">"{{ m.text }}"</div>

<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span class="chip {{ p.sevClass }}"><span class="dot"></span>{{ p.sevLabel }}</span><span style="font-weight: 800">{{ p.risk }}</span></div>
</button>
</sc-for>

</div>

</label>

<script>

(function(){
  const e = React.createElement;
  const WHOLE = /^\s*\{\{\s*([^{}]+?)\s*\}\}\s*$/;
  const HOLE = /\{\{\s*([^{}]+?)\s*\}\}/g;
  function lookup(path, scopes) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    const parts = path.split('.');
    for (let i = scopes.length - 1; i >= 0; i--) {
      const s = scopes[i];
      if (s != null && parts[0] in Object(s)) {
        let v = s;
        for (const p of parts) { if (v == null) return undefined; v = v[p]; }
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scopes) { return str.replace(HOLE, (_, p) => { const v = lookup(p, scopes); return v == null ? '' : String(v); }); }
  function attrVal(v, scopes) { const m = v.match(WHOLE); if (m) return lookup(m[1], scopes); return v.indexOf('{{') >= 0 ? interp(v, scopes) : v; }
  function styleObj(s) {
    const o = {};
    s.split(';').forEach((d) => {
      const i = d.indexOf(':'); if (i < 0) return;
      let k = d.slice(0, i).trim(); const v = d.slice(i + 1).trim(); if (!k) return;
      if (!k.startsWith('--')) k = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
      o[k] = v;
    });
    return o;
  }
  function propName(n) {
    if (n === 'class') return 'className';
    if (n === 'for') return 'htmlFor';
    if (/^(aria|data)-/.test(n)) return n;
    if (n.indexOf('-') >= 0) return n.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    if (n === 'readonly') return 'readOnly';
    if (n === 'tabindex') return 'tabIndex';
    return n;
  }
  function childArr(node, scopes) {
    const out = []; let i = 0;
    for (const c of node.childNodes) { const r = render(c, scopes, i++); if (r !== null && r !== undefined) out.push(r); }
    return out;
  }
  function render(node, scopes, key) {
    if (node.nodeType === 3) {
      const t = node.nodeValue;
      if (!t.trim() && t.indexOf('\n') >= 0) return null;
      return t.indexOf('{{') >= 0 ? interp(t, scopes) : t;
    }
    if (node.nodeType !== 1) return null;
    const tag = node.nodeName;
    if (tag === 'sc-if') return attrVal(node.getAttribute('value'), scopes) ? e(React.Fragment, { key }, ...childArr(node, scopes)) : null;
    if (tag === 'sc-for') {
      const list = attrVal(node.getAttribute('list'), scopes) || [];
      const as = node.getAttribute('as') || 'item';
      return e(React.Fragment, { key }, list.map((it, i) => e(React.Fragment, { key: i }, ...childArr(node, scopes.concat([{ [as]: it, $index: i }])))));
    }
    const props = { key };
    for (const a of Array.from(node.attributes)) {
      if (a.name === 'xmlns' || a.name.indexOf('xmlns:') === 0) continue;
      let v = attrVal(a.value, scopes);
      const n = propName(a.name);
      if (n === 'style' && typeof v === 'string') v = styleObj(v);
      if (v === undefined) continue;
      props[n] = v;
    }
    return e(tag, props, ...childArr(node, scopes));
  }
  window.DCMount = function (tplText, Component) {
    let src = tplText.replace(/<!--[\s\S]*?-->/g, '').replace(/<(input|img|br|hr)\b([^>]*?)\s*\/?>/g, '<$1$2/>');
    const doc = new DOMParser().parseFromString('<root>' + src + '</root>', 'application/xml');
    const err = doc.getElementsByTagName('parsererror')[0];
    if (err) { document.body.textContent = 'Template error: ' + err.textContent; return; }
    const root = doc.documentElement;
    Component.prototype.render = function () { return e(React.Fragment, null, ...childArr(root, [this.renderVals()])); };
    ReactDOM.createRoot(document.getElementById('app')).render(e(Component, {}));
  };
  window.DCLogic = React.Component;
})();

</script>
<script>/* SafeSphere backend client.
   Base URL: ?api=<url> (remembered), else this page's origin when served over http(s), else http://localhost:8000.
   API key:  ?key=<key> (remembered on this device), sent as X-API-Key. */
window.SSApi = (function () {
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  };
  const qs = new URLSearchParams(location.search);
  if (qs.get('api')) store.set('ss_api', qs.get('api'));
  if (qs.get('key')) store.set('ss_key', qs.get('key'));

  class ApiError extends Error {
    constructor(status, msg) { super(typeof msg === 'string' ? msg : JSON.stringify(msg)); this.status = status; }
  }

  function base() {
    const b = store.get('ss_api') || (/^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:8000');
    return b.replace(/\/$/, '');
  }

  async function req(method, path, body, opts) {
    opts = opts || {};
    const headers = {};
    const key = store.get('ss_key');
    if (key) headers['X-API-Key'] = key;
    let payload;
    if (body instanceof FormData) payload = body;
    else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), opts.timeout || 60000);
    try {
      const r = await fetch(base() + path, { method, headers, body: payload, signal: ctl.signal });
      if (opts.raw) { if (!r.ok) throw new ApiError(r.status, await r.text()); return r; }
      const txt = await r.text();
      let data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
      if (!r.ok) throw new ApiError(r.status, (data && data.detail) || txt || r.statusText);
      return data;
    } finally { clearTimeout(t); }
  }

  /* Same bytes as Python json.dumps(obj, sort_keys=True, ensure_ascii=False) for flat objects,
     so evidence items can be re-hashed in the browser and checked against the backend's SHA-256. */
  function pyJson(obj) {
    const val = (v) => (v === null || v === undefined) ? 'null' : JSON.stringify(v);
    return '{' + Object.keys(obj).sort().map((k) => JSON.stringify(k) + ': ' + val(obj[k])).join(', ') + '}';
  }

  return {
    base, ApiError, pyJson,
    get: (p, o) => req('GET', p, undefined, o),
    post: (p, b, o) => req('POST', p, b, o),
    patch: (p, b) => req('PATCH', p, b),
    del: (p) => req('DELETE', p),
    raw: (method, p) => req(method, p, undefined, { raw: true }),
    hasKey: () => !!store.get('ss_key')
  };
})();
</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
    this.lastSender = {};
    this.D = this.makeData();
    this.state = this.initialState();
  }

  /* ================= backend (live mode) =================
     On load we call /health. If the backend and model are up, every screen uses the API and the scripted chats
     stream through the real model. Otherwise the original mock data runs ("Demo mode"). */
  componentDidMount() { this.connect(); }

  async connect() {
    this.setState({ conn: Object.assign({}, this.state.conn, { status: 'checking' }) });
    try {
      const h = await SSApi.get('/health', { timeout: 5000 });
      if (!h.model || !h.model.ready) throw new Error((h.model && h.model.error) || 'behaviour model not loaded');
      this.stopTimers();
      this.lastSender = {};
      this.setState({
        live: true, people: {}, sel: null, feed: [], alerts: [], idx: 0, running: false, unread: 0, packs: 0,
        panicPid: null, linkSugg: [], evLive: {}, details: {},
        ev: Object.assign({}, this.state.ev, { pid: null, generated: false, hashes: {}, fp: '', verify: '' }),
        imp: Object.assign({}, this.state.imp, { link: 'new' }),
        conn: { status: 'online', model: h.model.version || '', deepfake: (h.deepfake && h.deepfake.mode) || 'stub', base: SSApi.base(), error: '' }
      });
      await this.refreshPeople();
      this.loadLiveMetrics();
    } catch (e) {
      this.setState({ live: false, conn: { status: 'offline', base: SSApi.base(), error: String((e && e.message) || e) } });
    }
  }

  liveFail(e, what) {
    const msg = (e && e.message) || String(e);
    if (e && e.name === 'TypeError') {   // network error: backend went away
      this.setState({ live: false, conn: Object.assign({}, this.state.conn, { status: 'offline', error: msg }) });
      this.showToast('Lost the connection to the backend. Switched to demo mode.', { label: 'Retry', action: () => this.connect() });
    } else {
      this.showToast((what ? what + ': ' : '') + msg);
    }
  }

  LABELS() {
    return { safe_mutual: 'Mutual', banter: 'Banter', normal_frequent: 'Normal contact', unreciprocated: 'Unreciprocated',
      stalking: 'Stalking', harassment_after_no: 'Ignored "no"', group_bullying: 'Bullying', sextortion: 'Sextortion' };
  }
  appCode(a) { return { wa: 'WA', ig: 'IG', tg: 'TG', sms: 'SMS', snap: 'SNAP', fb: 'SMS' }[a] || 'SMS'; }
  localIso(d) { const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' }) : ''; }
  pSev(p) { return (p && p.level) || this.sevOf(p ? p.risk : 0); }
  emptyPerson() {
    return { id: '', name: 'No one yet', initials: '–', rel: 'Stranger', risk: 0, level: 'info', tags: [], tagline: '', accounts: [],
      timeline: [{ phase: 'Neutral', w: 100, date: '', tip: 'No messages yet' }], reasons: [], features: [],
      activity: new Array(14).fill(0), night: new Array(14).fill(0), history: [] };
  }

  /* backend person view (+ optional detail and messages) -> the shape the template expects */
  mapPerson(v, old, d, msgs) {
    const L = this.LABELS();
    const PH = { mutual: 'Mutual', unreciprocated: 'Unreciprocated', rejected: 'Rejected', violation: 'Violation', neutral: 'Neutral' };
    const name = v.display_name || 'Unknown';
    const words = name.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);

  async refreshPeople(detailId) {
    try {
      const [list, sugg] = await Promise.all([SSApi.get('/people'), SSApi.get('/links/suggestions')]);
      const people = {};
      list.forEach((v) => { people[v.id] = this.mapPerson(v, this.state.people[v.id]); });
      const sel = people[this.state.sel] ? this.state.sel : (list[0] ? list[0].id : null);
      this.setState({ people, linkSugg: sugg || [], sel }, () => { const id = detailId || this.state.sel; if (id && people[id]) this.loadPersonDetail(id); });
    } catch (e) { this.liveFail(e, 'Could not load people'); }
  }

  async loadPersonDetail(id) {
    try {
      const [d, msgs] = await Promise.all([SSApi.get('/people/' + id), SSApi.get('/people/' + id + '/messages?limit=500')]);
      const np = Object.assign({}, this.state.people);
      np[id] = this.mapPerson(d, np[id], d, msgs);
      this.setState({ people: np, details: Object.assign({}, this.state.details, { [id]: d }) });
      return d;
    } catch (e) { if (e && e.status !== 404) this.liveFail(e, 'Could not load this person'); return null; }
  }

  selectPerson(id) { this.setState({ sel: id }); if (this.state.live && id) this.loadPersonDetail(id); }

  /* account-link suggestions for one person, shown as "pending" accounts */
  pendingLinks(pid) {
    return (this.state.linkSugg || []).filter((s) => s.person_id === pid || s.other_person_id === pid).map((s) => {
      const other = s.person_id === pid ? s.other_person_id : s.person_id;
      const op = this.state.people[other];
      const acc = op && op.accounts[0];
      return acc ? { app: acc.app, handle: acc.handle, label: 'Linked ' + Math.round(s.score * 100) + '%', reason: (s.reasons || []).join('. ') || 'Similar to this person', status: 'pending', otherId: other } : null;
    }).filter(Boolean);
  }

  /* ---------- feed simulation ---------- */
  scriptFor() { return this.D.script.filter((m) => m.scen.indexOf(this.state.scenario) >= 0); }
  startFeed() {
    if (this.feedTimer) clearInterval(this.feedTimer);
    if (this.state.live && this.state.idx === 0 && !this.state.feed.length) {
      // a fresh demo run starts from a clean slate, so earlier runs can't leak into this one
      this.lastSender = {};
      this.setState({ running: true, people: {}, sel: null, alerts: [], linkSugg: [], evLive: {} });
      SSApi.del('/data').then(() => { this.feedTimer = setInterval(() => this.tick(), 1700 / this.state.speed); }, (e) => { this.setState({ running: false }); this.liveFail(e, 'Could not start the demo'); });
      return;
    }
    this.setState({ running: true });
    this.feedTimer = setInterval(() => this.tick(), 1700 / this.state.speed);
  }
  pauseFeed() { if (this.feedTimer) clearInterval(this.feedTimer); this.feedTimer = null; this.setState({ running: false }); }
  tick() {
    if (!this.state.protection) return;
    const list = this.scriptFor();
    const i = this.state.idx;
    if (i >= list.length) { this.pauseFeed(); this.showToast('Demo script finished. Press Reset to play again.'); return; }
    const src = list[i];
    if (this.state.live) { this.tickLive(src, i); return; }
    const m = Object.assign({}, src, { id: 'm' + Date.now() + i, time: this.nowTime(), safe: false });
    const prior = this.state.feed;
    if (!m.mine && m.pid) {
      const refusals = prior.filter((x) => x.mine && x.pid === m.pid).length;
      if (refusals) { m.afterNo = prior.filter((x) => !x.mine && x.pid === m.pid && x.afterNo).length + 1; m.refusals = refusals; }
    }
    const st = { idx: i + 1, feed: [m].concat(prior) };
    if (m.risk && m.pid && this.state.people[m.pid]) { const np = Object.assign({}, this.state.people); np[m.pid] = Object.assign({}, np[m.pid], { risk: m.risk }); st.people = np; }
    const isAlert = !m.mine && (m.sev === 'high' || m.sev === 'critical');
    if (isAlert) {
      st.alerts = [m].concat(this.state.alerts);
      if (this.state.screen !== 'feed') st.unread = this.state.unread + 1;
    }
    this.setState(st);
    if (m.sev === 'critical') {
      this.showToast('Critical: ' + (m.cat === 'Threat' ? 'threat' : 'possible sextortion') + ' from ' + m.from + '. Don\'t reply.', { label: 'Get help', action: () => this.openPanic(m.pid), sev: 'critical', ms: 8000 });
      this.later(() => this.openPanic(m.pid), 900);
    }
  }
  /* scripted message -> notification the Android listener would produce */
  toNotification(src) {
    const APPL = { WA: 'wa', IG: 'ig', TG: 'tg', SMS: 'sms', SNAP: 'snap' };
    const REL = { Stranger: 'stranger', Acquaintance: 'acquaintance', Friend: 'friend', Partner: 'partner', Family: 'family', Classmate: 'acquaintance' };
    const key = (src.pid || src.from) + ':' + src.app;
    let sender = src.from, handle = src.handle || src.from;
    if (src.mine) {
      const last = this.lastSender[key] || Object.keys(this.lastSender).filter((k) => k.indexOf((src.pid || '') + ':') === 0).map((k) => this.lastSender[k]).pop();
      if (last) { sender = last.sender; handle = last.handle; }
    } else {
      this.lastSender[key] = { sender, handle };
    }
    const mp = src.pid && this.D.people[src.pid];
    const rel = mp ? REL[mp.rel] : (src.from === 'Mom' ? 'family' : undefined);
    return {
      app: APPL[src.app] || 'sms', sender, sender_handle: handle, is_user: !!src.mine,
      text: src.hidden ? null : (src.text || (src.media ? '📷 Photo' : null)),
      media_type: src.media ? 'image' : null, timestamp: this.localIso(this.nextSimTime()),
      relationship: rel, is_group: /group|·/i.test(src.from || '')
    };
  }

  /* Scenario clock: the scripts happen in the evening (sextortion late at night), a few minutes apart,
     instead of at the real time of the demo. Time of day is a real model signal, so this matters. */
  nextSimTime() {
    if (!this.simTime || this.state.idx === 0) {
      const start = { sextortion: [22, 55], refusal: [21, 0], stalker: [18, 0], bullying: [16, 0], flirt: [17, 30], full: [17, 0] }[this.state.scenario] || [20, 0];
      const d = new Date(); d.setHours(start[0], start[1], 0, 0);
      if (d > new Date()) d.setDate(d.getDate() - 1);
      this.simTime = d;
    } else {
      this.simTime = new Date(this.simTime.getTime() + (3 + Math.floor(Math.random() * 6)) * 60000);
    }
    return this.simTime;
  }

  async tickLive(src, i) {
    if (this.state.busy) return;
    this.setState({ busy: true });
    const L = this.LABELS();
    try {
      const r = await SSApi.post('/ingest/notification', this.toNotification(src));
      const pv = r.people[0];
      const lab = (r.labels || [])[0] || {};
      const d = await SSApi.get('/people/' + pv.id).catch(() => null);
      const PH = { mutual: 'Mutual', unreciprocated: 'Unreciprocated', rejected: 'Rejected', violation: 'Violation' };
      const tl = (d && d.consent_timeline) || [];
      const m = Object.assign({}, src, {
        id: 'm' + Date.now() + i, time: this.simTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), safe: false, pid: pv.id, why: '', cat: '', risk: Math.round((pv.risk || 0) * 100),
        phase: tl.length ? PH[tl[tl.length - 1].phase] : undefined
      });
      if (src.mine) {
        m.sev = 'info';
        m.refusal = lab.label === 'reject';
        m.rejectNote = m.refusal ? (src.rejectNote || '') : 'The model read this as a ' + (lab.label || 'neutral') + ' reply, not a refusal.';
        if (!m.refusal) m.phase = undefined;
      } else {
        m.sev = pv.level;
        m.cat = pv.level === 'info' ? '' : (pv.early ? 'Early signal' : (L[pv.label] || ''));
        m.why = (pv.reasons || [])[0] || '';
        const after = d && d.facts && d.facts.msgs_after_reject;
        if (after && m.phase === 'Violation') { m.afterNo = Math.round(after); }
      }
      const np = Object.assign({}, this.state.people);
      np[pv.id] = this.mapPerson(pv, np[pv.id], d || undefined);
      const st = { idx: i + 1, feed: [m].concat(this.state.feed), people: np, busy: false, sel: this.state.sel || pv.id };
      const newAlerts = (r.new_alerts || []).map((a) => Object.assign({}, m, { id: 'a' + a.id, alertId: a.id, sev: a.level, cat: L[a.label] || a.label, why: (a.reasons || [])[0] || a.summary, pid: a.person_id }));
      if (newAlerts.length) {
        st.alerts = newAlerts.concat(this.state.alerts);
        if (this.state.screen !== 'feed') st.unread = this.state.unread + newAlerts.length;
      }
      this.setState(st);
      const crit = newAlerts.find((a) => a.sev === 'critical');
      if (crit) {
        this.showToast('Critical: ' + crit.cat.toLowerCase() + ' from ' + crit.from + '. Don\'t reply.', { label: 'Get help', action: () => this.openPanic(crit.pid), sev: 'critical', ms: 8000 });
        this.later(() => this.openPanic(crit.pid), 900);
      }

    } catch (e) {
      this.setState({ busy: false });
      this.pauseFeed();
      this.liveFail(e, 'Scoring failed');
    }
  }

        const np = Object.assign({}, people); const A = np[G.a], B = np[G.b]; np[G.a] = Object.assign({}, A, { accounts: A.accounts.concat(B.accounts.map((x) => Object.assign({}, x, { label: 'Merged by you', status: 'confirmed' }))), risk: Math.max(A.risk, B.risk), tags: A.tags.concat(B.tags.filter((t) => A.tags.indexOf(t) < 0)) }); delete np[G.b]; this.setState({ people: np, dlg: null, sel: G.a }); this.showToast('Merged ' + B.name + ' into ' + A.name + '.'); } });
    }

    /* panic */
    const PP = people[S.panicPid] || plist[0] || EMPTY;
    const LIVEWHAT = { sextortion: PP.name + ' is threatening you or demanding money. Don\'t pay and don\'t reply.',
      harassment_after_no: PP.name + ' kept messaging you after you said no. You did the right thing by saying no.',
      stalking: PP.name + ' is contacting you obsessively and may be tracking where you are.',
      group_bullying: 'You are being targeted in a group chat.' };
    const what = (S.live ? (LIVEWHAT[PP.label] || (PP.name + ' is contacting you in a way that looks harmful. Here is what to do right now.')) : { vikram: 'Vikram S ignored your "no" three times and is threatening to share your photos. You did the right thing by saying no.', tg: 'Someone sent a manipulated intimate image of you with a money demand.', rahul: 'Rahul K is following you and has threatened to come to your home.', arjun: 'You are being insulted in a group chat.' }[PP.id]) || 'Here is what to do right now.';
    const C = S.checks;
    const cks = [['ev', 'Evidence saved (done automatically)'], ['ncii', 'Hash the image on StopNCII'], ['call', 'Call 1930'], ['report', 'Report on cybercrime.gov.in'], ['tell', 'Tell someone you trust']];

      close: () => this.setState({ panic: false })
    };

    /* bell */
    const bell = { open: S.bell, hasCount: S.alerts.length > 0, count: S.alerts.length, empty: S.alerts.length === 0, items: S.alerts.slice(0, 5).map(alertView) };

    const T2 = S.toast;
    return {
      conn: S.conn.status === 'online'
        ? { label: '● Live model', title: 'Connected to ' + S.conn.base + (S.conn.deepfake === 'stub' ? ' · deepfake connector: stub' : ''), style: 'background: var(--brandSoft); color: var(--brand); border: 0; cursor: pointer', click: () => this.go('settings') }
        : S.conn.status === 'checking'

          : { label: 'Demo mode · backend offline', title: 'Showing sample data. ' + (S.conn.error || '') + ' Click to retry.', style: 'background: var(--warn-bg); color: var(--warn-ink); border: 0; cursor: pointer', click: () => this.connect() },
      themeClass: S.theme === 'dark' ? 'dark' : '', t: T, sub: D.SUB[S.lang], exitMode: S.exit, appMode: !S.exit,
      forecast: [{ d: 'Thu', s: 'Light rain', t: '28° / 24°' }, { d: 'Fri', s: 'Cloudy', t: '29° / 24°' }, { d: 'Sat', s: 'Sunny', t: '31° / 25°' }, { d: 'Sun', s: 'Sunny', t: '31° / 25°' }, { d: 'Mon', s: 'Partly cloudy', t: '30° / 24°' }],
      quickExit: () => { this.pauseFeed(); this.setState({ exit: true, panic: false, dlg: null, toast: null, bell: false }); },

      toggleBell: () => this.setState({ bell: !S.bell }), bell,
      toggleLang: () => this.setState({ lang: S.lang === 'en' ? 'hi' : 'en' }), langLabel: S.lang === 'en' ? 'हिं' : 'EN',
      toggleTheme: () => this.setState({ theme: S.theme === 'dark' ? 'light' : 'dark' }), themeLabel: S.theme === 'dark' ? 'Light' : 'Dark',
      openHelp: () => this.openPanic(S.panicPid),
      startFromHome: () => { this.go('feed'); this.startFeed(); },
      nav, is, kpis, home, feed, people: peopleV, pd, media, imp, ev, met, slang, set, dlg, panic, peopleOpts,
      toast: { show: !!T2, text: T2 ? T2.text : '', hasAction: !!(T2 && T2.action), actionLabel: T2 ? T2.actionLabel : '', action: () => { if (T2 && T2.action) T2.action(); }, close: () => this.setState({ toast: null }), border: T2 && T2.sev ? SEV[T2.sev].border : 'bl-none' }
    };
  }
